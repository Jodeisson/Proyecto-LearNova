<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | LearNova</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-card {
            max-width: 460px;
            margin: 3rem auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .auth-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.25rem;
        }
        .btn-logout {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-logout:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="assets/img/Logo-LearNova.png" alt="LearNova Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo">Lear<span>Nova</span></div>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalog.html">Cursos</a>
            <a href="contact.html">Contacto</a>
            <a href="login.html" id="nav-auth-link" class="active-link">Ingresar</a>
            <a href="admin/login.html" class="btn-admin">Admin</a>
        </nav>
        <div id="user-profile-widget" class="user-badge" aria-hidden="true">
            <div id="user-avatar-letter" class="user-avatar"></div>
            <div class="user-meta">
                <span id="user-display-name" class="user-name"></span>
                <span id="user-display-email" class="user-email"></span>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <!-- Vista cuando YA inició sesión -->
            <div id="logged-in-box" style="display: none; text-align: center;">
                <h1 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Sesión activa</h1>
                <p id="active-user-info" class="modal-subtitle"></p>
                <div class="auth-actions">
                    <a href="catalog.html" class="btn-primary">Ir al catálogo</a>
                    <button type="button" id="logout-btn" class="btn-logout">Cerrar sesión</button>
                </div>
            </div>

            <!-- Vista cuando NO ha iniciado sesión -->
            <div id="auth-box">
                <h1 id="auth-title" style="font-size: 1.6rem; margin-bottom: 0.4rem;">Iniciar sesión</h1>
                <p id="auth-subtitle" class="modal-subtitle">Accede a tu cuenta para publicar y explorar cursos.</p>

                <form id="auth-form">
                    <div id="name-group" class="form-group" style="display: none;">
                        <label for="auth-name">Nombre completo</label>
                        <input type="text" id="auth-name" placeholder="Ej. Laura Gómez">
                    </div>

                    <div class="form-group">
                        <label for="auth-email">Correo electrónico</label>
                        <input type="email" id="auth-email" required placeholder="tu@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="auth-password">Contraseña</label>
                        <input type="password" id="auth-password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>

                    <button type="submit" id="auth-submit" class="btn-primary full-width">Entrar</button>
                </form>

                <p id="auth-message" style="margin-top: 0.8rem; font-size: 0.9rem; text-align: center;"></p>

                <p style="margin-top: 1.2rem; text-align: center; font-size: 0.9rem;">
                    <span id="toggle-text">¿No tienes cuenta?</span>
                    <button type="button" id="toggle-mode-btn" style="background: none; border: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer;">
                        Crear cuenta
                    </button>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LearNova. Proyecto Final Avanzado.</p>
    </footer>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/nav-sesion.js"></script>
</body>
</html>
