<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador | LearNova</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="logo" style="text-align: center; margin-bottom: 1.5rem;">
            Lear<span>Nova</span> <small style="display: block; font-size: 0.8rem; color: #64748B;">Panel de Control</small>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario Administrador</label>
                <input type="text" id="username" required placeholder="Ej. admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary full-width">Ingresar al Panel</button>
            <p id="login-error" class="form-status error hidden" style="margin-top: 1rem;">Usuario o contraseña incorrectos.</p>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="../index.html" style="color: #64748B; text-decoration: none; font-size: 0.9rem;">← Volver al inicio</a>
        </div>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
